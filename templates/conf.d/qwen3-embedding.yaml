# Qwen3-Embedding 0.6B / 4B / 8B and voyage-4-nano on MLX behind embedding/qwen3/server.py: OpenAI /v1/embeddings
# (input_type, dimensions = Matryoshka truncation or zero padding, base64), like embeddinggemma-2.
# MLX cache 4096 MB during a request, cleared after it.
# One entry per model (2026-11-18; the -int8 entries are gone, no aliases). Short queries (~36 tokens with the
# instruction) are the main traffic, and there W8A8 and MLX 8-bit quantized_matmul are slower than 16-bit:
#   0.6B, 4B: exact FP16 zero-copy copies (common/qwen3_w8a8.py --float)
#   voyage-4-nano: exact BF16 (float16 activations overflow on some 300+ token inputs)
#   8B: per-class copy (common/qwen3_w8a8.py mix, mix.json): q/k/v, o, gate/up W8A8, down 8-bit weights (exact Q8_0),
#       FP16 activations. Its vectors differ from the old Q8_0 8B (an index built with one cannot be queried with the other).
# Capacities = wired peak of one ~32K-token input + ~0.5 GB; see docs/w8a8.md and docs/performance.md.
macros:
  "qe-cmd": >
    @PYTHON@ @ROOT@/embedding/qwen3/server.py --host 127.0.0.1 --port ${PORT} --cache-mb 4096

models:
  "qwen3-embedding-0.6b":
    name: "Qwen3 Embedding 0.6B (1024d)"
    description: "Text embeddings, 32K context; dimensions 32-1024 (Matryoshka)"
    cmd: ${qe-cmd} --model-id qwen3-embedding-0.6b --model @MODELS@/qwen3-embedding/zc-0.6b-fp16
    checkEndpoint: /health
    ttl: 1800
    capacities:
      gpu: 3500             # wired peak +2729 MiB, one 32K-token input
    evict_cost: 0

  "qwen3-embedding-4b":
    name: "Qwen3 Embedding 4B (2560d)"
    description: "Text embeddings, 32K context; dimensions 32-2560 (Matryoshka)"
    cmd: ${qe-cmd} --model-id qwen3-embedding-4b --model @MODELS@/qwen3-embedding/zc-4b-fp16
    checkEndpoint: /health
    ttl: 1800
    capacities:
      gpu: 12000            # wired peak +11218 MiB, one 32K-token input
    evict_cost: 0

  "qwen3-embedding-8b":
    name: "Qwen3 Embedding 8B (4096d)"
    description: "Most accurate text embeddings, 32K context; dimensions 32-4096 (Matryoshka); per-class W8A8 / 8-bit"
    cmd: ${qe-cmd} --model-id qwen3-embedding-8b --model @MODELS@/qwen3-embedding/mix-8b
    checkEndpoint: /health
    ttl: 1800
    capacities:
      gpu: 10500            # wired peak 9983 MiB, one 32K-token input
    evict_cost: 0

  "voyage-4-nano":
    name: "voyage-4-nano (2048d)"
    description: "Small fast text embeddings, 32K context; dimensions 2048/1024/512/256"
    cmd: ${qe-cmd} --model-id voyage-4-nano --model @MODELS@/voyage-4-nano/zc-bf16
    checkEndpoint: /health
    ttl: 1800
    capacities:
      gpu: 3000             # wired peak +2263 MiB, one 32K-token input
    evict_cost: 0
