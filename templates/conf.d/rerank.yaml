# Python 3.15 validation: peak wired deltas 2772 / 8694 / 9869 MiB, including load.
# Capacities include a margin; see docs/rerank-validation.json.
macros:
  "rerank-cmd": >
    @PYTHON@ @ROOT@/rerank/server.py --host 127.0.0.1 --port ${PORT}
    --max-batch-tokens 8192 --cache-mb 256

models:
  "qwen3-reranker-0.6b":
    name: "Qwen3 Reranker 0.6B"
    description: "Fast reranker (20 docs ~0.13 s)"
    cmd: ${rerank-cmd} --model-id qwen3-reranker-0.6b --model @MODELS@/qwen3-reranker/mlx-0.6b-bf16
    capabilities:
      reranker: true
    checkEndpoint: /health
    ttl: 1800
    capacities:
      gpu: 3500
    evict_cost: 0

  "qwen3-reranker-4b":
    name: "Qwen3 Reranker 4B"
    description: "Default reranker (20 docs ~0.84 s)"
    cmd: ${rerank-cmd} --model-id qwen3-reranker-4b --model @MODELS@/qwen3-reranker/mlx-4b-bf16
    capabilities:
      reranker: true
    checkEndpoint: /health
    ttl: 1800
    capacities:
      gpu: 10000
    evict_cost: 0

  "qwen3-reranker-8b":
    name: "Qwen3 Reranker 8B"
    description: "Most accurate reranker (20 docs ~1.80 s)"
    cmd: ${rerank-cmd} --model-id qwen3-reranker-8b --model @MODELS@/qwen3-reranker/mlx-8b-q8_0
    capabilities:
      reranker: true
    checkEndpoint: /health
    ttl: 1800
    capacities:
      gpu: 11000
    evict_cost: 0
