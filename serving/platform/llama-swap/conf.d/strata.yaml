# Flash-Next via ain-soph/Strata serving at 4cf59801f.
# 262144 tokens per slot, two physical states, Q2_0 MTP, INT8 KV, 1024 MiB conversation cache.
# Compact dual-slot qualification on M5 Ultra peaked at +67695 MiB wired.
# Reserve 69500 MiB for either weight variant. See reports/strata-compact-dual-20261119.md.
models:
  "qwen3.8-flash-next":
    name: "Qwen3.8 Flash-Next"
    description: "AtomicChat AD-4.27 on Strata, 262144 ctx x 2 slots, compact Metal, MTP"
    cmd: >
      @SERVING_ROOT@/.venv/bin/python @STRATA_RELEASE@/serve/server.py
      --engine strata --config @SERVING_ROOT@/services/text/strata/configs/strata-ad427-c262k-p2-compact.json
      --host 127.0.0.1 --port ${PORT}
    env:
      - "XDG_CONFIG_HOME=@SERVING_ROOT@/services/text/strata/config"
    checkEndpoint: /health
    concurrencyLimit: 64
    capacities:
      gpu: 69500
    evict_cost: 100

  "qwen3.8-flash-next-uncensored":
    name: "Qwen3.8 Flash-Next Uncensored"
    description: "Navin AD-4.27 on Strata, 262144 ctx x 2 slots, compact Metal, MTP"
    cmd: >
      @SERVING_ROOT@/.venv/bin/python @STRATA_RELEASE@/serve/server.py
      --engine strata --config @SERVING_ROOT@/services/text/strata/configs/strata-uncensored-c262k-p2-compact.json
      --host 127.0.0.1 --port ${PORT}
    env:
      - "XDG_CONFIG_HOME=@SERVING_ROOT@/services/text/strata/config"
    checkEndpoint: /health
    concurrencyLimit: 64
    capacities:
      gpu: 69500
    evict_cost: 50
