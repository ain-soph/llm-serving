# Qwen3-Reranker 0.6B / 4B / 8B (Qwen, Apache 2.0) on MLX behind ~/llm-serving/services/rerank/server.py, a llama.cpp-compatible
# POST /v1/rerank {"model", "query", "documents", "top_n"?, "return_documents"?} -> relevance_score = sigmoid(yes - no),
# as the official recipe. Owner: rerank (2026-11-16). Report: ~/llm-serving/reports/rerank.md.
# MLX instead of llama-server: llama-server scores documents one by one; MLX batches them and is 1.4-2.8x faster on M5.
# 2026-11-18 (agent PA1, evals/precision/pa1-1118-1050, per-class W8A8 / W8A16 / BF16 / FP16 on speed, error and disk):
# ONE entry per size, each a per-class precision copy written by shared/common/qwen3_w8a8.py mix (mix.json, page-aligned,
# mapped zero-copy). The old exact / -int8 pairs are gone (no aliases):
#   0.6B: q/k/v, o, gate/up W8A8, down BF16, BF16 activations (0.84 GB; was 1.19)
#   4B:   q/k/v, o, gate/up W8A8, down FP16, FP16 activations (5.31 GB; was 8.04 + 4.42): 60 queries x 20 docs 63.5 -> 47.1 s,
#         one short document 33.5 -> 20.5 ms; SciFact-60 nDCG@10 0.8484 -> 0.8423, top-1 96.7%, max error vs transformers 0.017
#   8B:   every projection W8A8 (7.65 GB; was the exact Q8_0 8.51 + 7.65): 132.8 -> 81.7 s, short 45.2 -> 26.9 ms; mean score
#         change 0.0046, top-1 98.3% (the same numbers as the old qwen3-reranker-8b-int8)
# Documents are sorted by length before batching; one long document (> --max-batch-tokens) runs its MLP in token chunks
# (exact). Capacities = wired peak of one 32K-token document (measured at apply time) + ~0.5 GB.
macros:
  "rerank-cmd": >
    ${env.LLM_SERVING}/.venv/bin/python ${env.LLM_SERVING}/services/rerank/server.py
    --host 127.0.0.1 --port ${PORT}
models:
  "qwen3-reranker-0.6b":
    name: "Qwen3 Reranker 0.6B"
    description: "Fast reranker (20 docs ~0.1 s)"
    cmd: ${env.LLM_SERVING}/bin/archive-restore --port ${PORT} --model qwen3-reranker -- ${rerank-cmd} --model-id qwen3-reranker-0.6b --model ${env.LLM_MODELS}/qwen3-reranker/mix-0.6b
    capabilities:
      reranker: true
    checkEndpoint: /health
    ttl: 1800
    capacities:
      gpu: 3000             # wired peak 2388 MiB, one 32K-token document (pa1b)
    evict_cost: 0
  "qwen3-reranker-4b":
    name: "Qwen3 Reranker 4B"
    description: "Open WebUI reranker: per-class W8A8 / FP16 (20 docs ~0.6 s)"
    cmd: ${env.LLM_SERVING}/bin/archive-restore --port ${PORT} --model qwen3-reranker -- ${rerank-cmd} --model-id qwen3-reranker-4b --model ${env.LLM_MODELS}/qwen3-reranker/mix-4b
    capabilities:
      reranker: true
    checkEndpoint: /health
    ttl: 1800
    capacities:
      gpu: 8000            # wired peak 7309 MiB, one 32K-token document (pa1b)
    evict_cost: 0
  "qwen3-reranker-8b":
    name: "Qwen3 Reranker 8B"
    description: "Most accurate reranker, W8A8 (20 docs ~1.1 s)"
    cmd: ${env.LLM_SERVING}/bin/archive-restore --port ${PORT} --model qwen3-reranker -- ${rerank-cmd} --model-id qwen3-reranker-8b --model ${env.LLM_MODELS}/qwen3-reranker/mix-8b
    capabilities:
      reranker: true
    checkEndpoint: /health
    ttl: 1800
    capacities:
      gpu: 9500            # wired peak 8775 MiB, one 32K-token document (pa1b)
    evict_cost: 0
