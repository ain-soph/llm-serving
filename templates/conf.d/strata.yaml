models:
  "qwen3.8-flash-next":
    name: "Qwen3.8 Flash-Next"
    description: "AtomicChat AD-4.27 on Strata, 262144 ctx x 2 slots, MTP"
    cmd: >
      @PYTHON@ @STRATA_SOURCE@/serve/server.py
      --engine strata --config @CONFIG@/strata/strata-ad427-c262k-p2.json
      --host 127.0.0.1 --port ${PORT}
    env:
      - "XDG_CONFIG_HOME=@STATE@/strata"
    checkEndpoint: /health
    concurrencyLimit: 64
    capacities:
      gpu: 71000
    evict_cost: 100

  "qwen3.8-flash-next-uncensored":
    name: "Qwen3.8 Flash-Next Uncensored"
    description: "Navin AD-4.27 on Strata, 262144 ctx x 2 slots, MTP"
    cmd: >
      @PYTHON@ @STRATA_SOURCE@/serve/server.py
      --engine strata --config @CONFIG@/strata/strata-uncensored-c262k-p2.json
      --host 127.0.0.1 --port ${PORT}
    env:
      - "XDG_CONFIG_HOME=@STATE@/strata"
    checkEndpoint: /health
    concurrencyLimit: 64
    capacities:
      gpu: 71000
    evict_cost: 50
