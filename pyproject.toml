[project]
name = "llm-serving-macos"
version = "0.1.0"
description = "Local model APIs and reproducible deployment for Apple Silicon"
requires-python = ">=3.15,<3.16"
dependencies = [
  "h3-image-mlx",
  "mflux",
  "mlx==0.32.4",
  "mlx-lm==0.32.2",
  "transformers==5.23.0",
  "mlx-whisper==0.4.3",
  "mlx-qwen3-asr[aligner]",
  "mlx-audio",
  "torchvision",
  "numpy==2.5.3",
  "pillow==13.0.0",
  "jinja2==3.1.6",
  "regex==2026.9.10",
  "pyyaml==6.0.3",
  "tqdm==4.70.1",
  "requests==2.34.2",
  "psutil==7.2.2",
  "soundfile==0.14.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.uv.sources]
h3-image-mlx = { git = "https://github.com/ain-soph/h3-image-mlx", rev = "ce8d4a35afefdab11a7f54abe5cfa034ea247c94" }
mflux = { git = "https://github.com/ain-soph/mflux", rev = "1770a76f4ee56e723f94e0d2df39069a8e195e95" }
mlx-audio = { git = "https://github.com/ain-soph/mlx-audio", rev = "ec2105231760ca3895d38711cbca6abfe5b77d89" }
mlx-qwen3-asr = { git = "https://github.com/ain-soph/mlx-qwen3-asr", rev = "38568173399a013b2856fc480a2dc06604d7a2e5" }
mlx-whisper = { git = "https://github.com/ain-soph/mlx-examples", rev = "46502543022c044396b44c83dd8848fcf4a1c168", subdirectory = "whisper" }
