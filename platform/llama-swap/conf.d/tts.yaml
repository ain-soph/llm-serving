# Text-to-speech (agent tts, 2026-11-17). Qwen3-TTS 12Hz 1.7B (Apache-2.0), BF16, via mlx-audio 0.6.6 behind
# ~/llm-serving/services/tts/server.py: POST /v1/audio/speech (OpenAI: model, input, voice, instructions, response_format
# mp3|opus|aac|flac|wav|pcm, speed, stream_format audio|sse; audio is streamed as it is generated), GET /v1/audio/voices.
# Weights: ~/models/qwen3-tts/<variant> (the speech tokenizer is one file hard-linked into every variant).
# Report: ~/llm-serving/reports/tts.md. capacities.gpu = measured wired peak delta (tts/eval/out/s1-*, s2-*) + margin.
macros:
  "tts-cmd": >
    ${env.LLM_SERVING}/.venv/bin/python ${env.LLM_SERVING}/services/tts/server.py --port ${PORT}

models:
  # 9 preset voices (Vivian, Serena, Uncle_Fu, Dylan = Beijing, Eric = Sichuan, Ryan, Aiden, Ono_Anna, Sohee) and the
  # OpenAI voice names mapped onto them; `instructions` sets emotion / style.
  "qwen3-tts":
    name: "Qwen3-TTS 1.7B"
    description: "Preset voices + style instructions; zh/en/ja/ko/de/fr/ru/it/es/pt; ~4x real time, first audio ~0.1 s"
    cmd: ${env.LLM_SERVING}/bin/archive-restore --port ${PORT} --model qwen3-tts -- ${tts-cmd} --model ${env.LLM_MODELS}/qwen3-tts/1.7B-CustomVoice --model-id qwen3-tts
    capabilities: &tts-caps
      in: [text]
      out: [audio]
      disableAuto: true
    checkEndpoint: /health
    ttl: 600
    capacities:
      gpu: 6500             # wired delta peak 4850 MiB (16 sentences + 1449/3621-char inputs)
    evict_cost: 10

  # Voice cloning: ref_audio (base64 / data URL, 3-20 s) + ref_text (its exact transcript) in the JSON body.
  "qwen3-tts-clone":
    name: "Qwen3-TTS 1.7B voice clone"
    description: "Clone a voice from ref_audio + ref_text"
    cmd: ${env.LLM_SERVING}/bin/archive-restore --port ${PORT} --model qwen3-tts -- ${tts-cmd} --model ${env.LLM_MODELS}/qwen3-tts/1.7B-Base --model-id qwen3-tts-clone
    capabilities: *tts-caps
    checkEndpoint: /health
    ttl: 600
    capacities:
      gpu: 7000             # wired delta peak 5603 MiB, including 11-minute runaway generations
    evict_cost: 10

  # Voice design: `instructions` describes the voice to create ("a warm, calm female narrator in her thirties").
  "qwen3-tts-design":
    name: "Qwen3-TTS 1.7B voice design"
    description: "Create a voice from a text description in `instructions`"
    cmd: ${env.LLM_SERVING}/bin/archive-restore --port ${PORT} --model qwen3-tts -- ${tts-cmd} --model ${env.LLM_MODELS}/qwen3-tts/1.7B-VoiceDesign --model-id qwen3-tts-design
    capabilities: *tts-caps
    checkEndpoint: /health
    ttl: 600
    capacities:
      gpu: 6500             # wired delta peak 5035 MiB
    evict_cost: 10

  # CosyVoice3 removed 2026-11-17 (user): Qwen3-TTS covers the dialects (Sichuan: `eric`, Cantonese: qwen3-tts-design),
  # deploy/tts-dialect-compare-1117. Code kept; weights deleted (re-download: see reports/tts.md).
