# Flash-Next via ain-soph/Strata serving at 82d63e19e (upstream main 6e38f588a + our commits).
# Compact dual-slot qualification on M5 Ultra peaked at +67695 MiB wired; 82d63e19e peaked at +65880..+66763 MiB (2026-11-21/22).
# Both profiles reserve 69500 MiB. See docs/performance.md.
models:
  "qwen3.8-flash-next":
    name: "Qwen3.8 Flash-Next"
    description: "AtomicChat AD-4.27 on Strata, 262144 ctx x 2 slots, compact Metal, MTP, Strata vision tower"
    cmd: >
      @PYTHON@ @STRATA_SOURCE@/terminal/serve/server.py
      --engine strata --config @CONFIG@/strata/strata-ad427-c262k-p2-compact.json
      --host 127.0.0.1 --port ${PORT}
    env:
      - "XDG_CONFIG_HOME=@STATE@/strata"
    checkEndpoint: /health
    concurrencyLimit: 64
    capacities:
      gpu: 69500
    evict_cost: 100

  "qwen3.8-flash-next-uncensored":
    name: "Qwen3.8 Flash-Next Uncensored"
    description: "Navin AD-4.27 on Strata, 262144 ctx x 2 slots, compact Metal, MTP, Strata vision tower"
    cmd: >
      @PYTHON@ @STRATA_SOURCE@/terminal/serve/server.py
      --engine strata --config @CONFIG@/strata/strata-uncensored-c262k-p2-compact.json
      --host 127.0.0.1 --port ${PORT}
    env:
      - "XDG_CONFIG_HOME=@STATE@/strata"
    checkEndpoint: /health
    concurrencyLimit: 64
    capacities:
      gpu: 69500
    evict_cost: 50
